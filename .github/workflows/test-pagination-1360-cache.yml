name: Test pagination 1360 - operations-per-run caching (no staling, baseline main)

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write
  actions: write

jobs:
  cache-test:
    runs-on: ubuntu-latest
    steps:
      - uses: chiranjib-swain/stale@da0270520ab479e2cbeace8ee08286f2a24d0c13
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          debug-only: false
          only-pr-labels: pagination-1360
          days-before-pr-stale: -1
          days-before-issue-stale: -1
          operations-per-run: 2
          sort-by: created
          ascending: false
