name: Test pagination 1360 - operations-per-run caching (no staling, fixed branch)

on:
  workflow_dispatch:
    inputs:
      operations-per-run:
        description: 'operations-per-run value for this dispatch'
        default: '2'
        required: false

permissions:
  contents: read
  issues: write
  pull-requests: write
  actions: write

jobs:
  cache-test:
    runs-on: ubuntu-latest
    steps:
      - uses: v-chiranjib-swain/stale@10f6df38bfe1ae062d6cb4de35e189bb69bd1276
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          debug-only: false
          only-pr-labels: pagination-1360
          days-before-pr-stale: -1
          days-before-issue-stale: -1
          operations-per-run: ${{ github.event.inputs.operations-per-run }}
          sort-by: created
          ascending: false
